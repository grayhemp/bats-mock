name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feature/**", "release/**"]
    paths-ignore:
      - .devcontainer/Containerfile
      - .devcontainer/image-version
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # -------------------------------------------------------
  # Formal checks (formatting + linting)
  # -------------------------------------------------------
  lint:
    name: Formal Checks (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🧮 Read image version
        id: image-version
        run: |
          image_version="$(tr -d '[:space:]' < .devcontainer/image-version)"
          if ! printf '%s\n' "${image_version}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version in .devcontainer/image-version: ${image_version}" >&2
            exit 1
          fi
          echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}-dev:${image_version}" >> "${GITHUB_OUTPUT}"

      - name: 🔐 Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee   # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Pull development container image
        run: |
          echo "Pulling development container image: ${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF}"
          docker pull "${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF}"
        env:
          STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF: ${{ steps.image-version.outputs.image_ref }}

      - name: 🔍 Run formal checks
        run: |
          echo "Running ./build check ..."
          release_version=""
          release_subject_pattern='^chore: Release (v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$)'
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_HEAD_REF:-}" == release/* ]]; then
            release_version="${GITHUB_HEAD_REF#release/}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" =~ ${release_subject_pattern} ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi
          # Use -e GIT_CONFIG_* to set safe.directory config without modifying host git config,
          # allowing the build script to run git commands in the mounted volume without safe.directory errors.
          docker run --rm \
            -v "$PWD:/code" \
            -w /code \
            -e "RELEASE_VERSION=${release_version}" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/code \
            --entrypoint /bin/bash \
            "${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF}" \
            ./build check
        env:
          STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF: ${{ steps.image-version.outputs.image_ref }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Comment broken links in documentation
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0    # v3.0.4
        with:
          path: .lychee-out.md

      - name: 🧪 Run Bats tests in development container
        run: |
          echo "Running Bats tests..."
          docker run --rm \
            -v "$PWD:/code" \
            -w /code \
            --entrypoint /bin/bash \
            "${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF}" \
            -lc 'bats --version && bats test --print-output-on-failure'
        env:
          STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_REF: ${{ steps.image-version.outputs.image_ref }}

  # -------------------------------------------------------
  # Bats test suite across OS versions
  # -------------------------------------------------------
  test:
    name: Bats Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Tests on ubuntu-22.04 fail since bats is too old
        os: [ubuntu-24.04, macos-14, macos-15]

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Install dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -y
            sudo apt-get install -y bats
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew update
            brew install bats-core
          fi

      - name: 🧪 Run Bats tests
        run: |
          echo "Running Bats tests..."
          bats --version
          bats test --print-output-on-failure
      - name: 🐞 Start tmate session (manual trigger only)
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.debug_enabled == 'true' &&
          matrix.os == github.event.inputs.debug_os
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113   # v3.24

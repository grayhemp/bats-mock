name: Devcontainer Image

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  guard-version-sync:
    name: Guard - ensure version bump
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if Containerfile and image-version are in sync
        if: github.event_name == 'pull_request'
        run: |
          # Get list of changed files
          changed_files="$(git diff --name-only "${PR_BASE_SHA}...HEAD")"

          containerfile_changed=false
          version_changed=false

          if echo "${changed_files}" | grep -q '^\.devcontainer/Containerfile$'; then
            containerfile_changed=true
          fi

          if echo "${changed_files}" | grep -q '^\.devcontainer/image-version$'; then
            version_changed=true
          fi

          # If Containerfile changed but image-version didn't, fail
          if [[ "${containerfile_changed}" == "true" ]] && [[ "${version_changed}" == "false" ]]; then
            echo "❌ Containerfile was modified but image-version was not."
            echo "When updating .devcontainer/Containerfile, you must also bump the version in .devcontainer/image-version."
            echo ""
            echo "Changed files:"
            echo "${changed_files}"
            exit 1
          fi

          echo "✅ Version sync check passed."
          echo "Containerfile changed: ${containerfile_changed}"
          echo "image-version changed: ${version_changed}"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  build-check-test-and-push:
    name: Build devcontainer and validate
    runs-on: ubuntu-24.04
    needs: guard-version-sync
    permissions:
      contents: read
      packages: write
    environment:
      name: container-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read image version
        id: image-version
        run: |
          image_version="$(tr -d '[:space:]' < .devcontainer/image-version)"
          if ! printf '%s\n' "${image_version}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version in .devcontainer/image-version: ${image_version}" >&2
            exit 1
          fi
          echo "image_version=${image_version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare image reference
        id: image-ref
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}-dev:${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_VERSION}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
        env:
          STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}

      - name: Build image from devcontainer Containerfile
        run: |
          docker build \
            -t "${STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF}" \
            --build-arg image_version="${STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_VERSION}" \
            -f .devcontainer/Containerfile \
            .
        env:
          STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF: ${{ steps.image-ref.outputs.image_ref }}
          STEPS_IMAGE_VERSION_OUTPUTS_IMAGE_VERSION: ${{ steps.image-version.outputs.image_version }}

      - name: Run build check in container
        run: |
          release_version=""
          release_subject_pattern='^chore: Release (v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$)'
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_HEAD_REF:-}" == release/* ]]; then
            release_version="${GITHUB_HEAD_REF#release/}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" =~ ${release_subject_pattern} ]]; then
            release_version="${BASH_REMATCH[1]}"
          fi
          docker run --rm \
            -v "$PWD:/code" \
            -e "RELEASE_VERSION=${release_version}" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/code \
            -w /code \
            --entrypoint /bin/bash \
            "${STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF}" \
            ./build check
        env:
          STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF: ${{ steps.image-ref.outputs.image_ref }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Run build test in container
        run: |
          docker run --rm \
            -v "$PWD:/code" \
            -w /code \
            --entrypoint /bin/bash \
            "${STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF}" \
            -lc 'bats --version && bats test --print-output-on-failure'
        env:
          STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF: ${{ steps.image-ref.outputs.image_ref }}

      - name: Login to GHCR
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee   # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image to GHCR
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: docker push "${STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF}"
        env:
          STEPS_IMAGE_REF_OUTPUTS_IMAGE_REF: ${{ steps.image-ref.outputs.image_ref }}

      - name: Explain skipped push for fork PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Skipping GHCR push because this pull request comes from a fork."
